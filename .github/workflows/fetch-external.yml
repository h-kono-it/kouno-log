name: Fetch External Content

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # deploy.yml を workflow_dispatch で起動するため

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Fetch RSS feeds
        run: node scripts/fetch-rss.js

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/external/ public/thumbnails/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="chore/update-external-content-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update external content"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore: update external content" \
            --body "RSS取得による外部コンテンツの自動更新" \
            --base main \
            --head "$BRANCH")
          # GITHUB_TOKEN による push は他ワークフローをトリガーしない仕様のため、
          # このPRでは e2e.yml が pull_request では走らない（action_required で止まる）。
          # main の必須チェック `e2e` を満たすには明示起動が要る
          # （workflow_dispatch はこのトリガー制限の例外）。
          #
          # ただし action_required の run は「チェックを1つも持たない check suite」を
          # head SHA に残す。GitHub の status rollup は同じアプリの最新 suite を採るので、
          # 放置すると dispatch した e2e の成功 suite が空の suite に上書きされ、
          # 必須チェック `e2e` が存在しない扱いになって PR が永久に BLOCKED になる。
          # 先に空の run を消してから dispatch する。
          for _ in $(seq 12); do
            PENDING=$(gh run list --branch "$BRANCH" --status action_required --json databaseId --jq '.[].databaseId')
            [ -n "$PENDING" ] && break
            sleep 5
          done
          # 複数ワークフロー分が少しずつ遅れて登録されるので、出揃うのを待って取り直す
          sleep 5
          for id in $(gh run list --branch "$BRANCH" --status action_required --json databaseId --jq '.[].databaseId'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
              || echo "::warning::run $id を削除できなかった"
          done

          gh workflow run e2e.yml --ref "$BRANCH"

          # rollup に e2e が現れないと --auto は永久に発火しない。
          # 黙って詰まらせず、現れなければこのワークフローを失敗させて気づけるようにする
          SEEN=""
          for _ in $(seq 24); do
            SEEN=$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '[.statusCheckRollup[].name] | index("e2e") // empty') || SEEN=""
            [ -n "$SEEN" ] && break
            sleep 5
          done
          if [ -z "$SEEN" ]; then
            echo "::error::e2e が PR のチェック一覧に現れなかった。必須チェックが埋まらずマージできない"
            exit 1
          fi

          # E2E が通ってから初めてマージされる。落ちたらマージされない
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          # 同じトリガー制限のため deploy.yml も明示起動する。
          # --auto はすぐにはマージしないので、マージ完了を待ってから叩く
          .github/scripts/deploy-after-merge.sh "$PR_URL"
