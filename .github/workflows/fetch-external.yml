name: Fetch External Content

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # deploy.yml を workflow_dispatch で起動するため

    steps:
      - uses: actions/checkout@v7
        with:
          # push と PR 作成を PAT 名義にするための checkout トークン。
          # GITHUB_TOKEN のままだと pull_request イベントが発火しない（下記参照）。
          # 未設定時にここで落ちると原因が見えないので、フォールバックして
          # 「Commit and push if changed」のガードで理由付きで止める
          token: ${{ secrets.BOT_PAT || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Fetch RSS feeds
        run: node scripts/fetch-rss.js

      - name: Commit and push if changed
        env:
          # GITHUB_TOKEN による push / PR 作成は他ワークフローをトリガーしない仕様で、
          # ci.yml が pull_request で走らず必須チェック `e2e` が埋まらない。
          # 以前は workflow_dispatch で明示起動して凌いでいたが、2026-09-13 の PR #169 で
          # dispatch した run のチェックが PR の statusCheckRollup に載らなくなり
          # （head SHA 上には success で存在するのに rollup に現れない）、PR が BLOCKED のまま
          # 詰まった。dispatch 経路自体が信用できないので PAT 名義に切り替える。
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          # 未設定のまま動くと GITHUB_TOKEN にフォールバックせず gh が無認証で落ちるだけなので、
          # 何が足りないのかをはっきり出して止める
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::secret BOT_PAT が未設定。PAT が無いと pull_request が発火せず必須チェック e2e が埋まらない"
            exit 1
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/external/ public/thumbnails/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="chore/update-external-content-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update external content"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore: update external content" \
            --body "RSS取得による外部コンテンツの自動更新" \
            --base main \
            --head "$BRANCH")
          # PAT 名義のPRなので pull_request が普通に発火し、ci.yml が走って
          # 必須チェック `e2e` が rollup に載る。dispatch も空 run 削除も要らない。
          #
          # 念のため、チェックが本当に現れたことは確認してから --auto に渡す。
          # 現れないまま放置すると PR が黙って永久に BLOCKED になるため、失敗させて気づけるようにする
          SEEN=""
          for _ in $(seq 24); do
            SEEN=$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '[.statusCheckRollup[].name] | index("e2e") // empty') || SEEN=""
            [ -n "$SEEN" ] && break
            sleep 5
          done
          if [ -z "$SEEN" ]; then
            echo "::error::e2e が PR のチェック一覧に現れなかった。必須チェックが埋まらずマージできない"
            exit 1
          fi

          # E2E が通ってから初めてマージされる。落ちたらマージされない
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          # PAT で有効化した auto-merge なら main への push も PAT 名義になり deploy.yml が
          # 自動で走るはずだが、走らなかった場合に静かにデプロイが止まるのは困るので確認して補う
          .github/scripts/deploy-after-merge.sh "$PR_URL"
