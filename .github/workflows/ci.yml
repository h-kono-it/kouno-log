name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ジョブIDの `e2e` は main の ruleset「branch-protect」が必須チェックとして
  # 見ている context そのもの。lint/build を含むようになった今も名前は変えられない。
  # 変えるなら ruleset の PUT と fetch-external.yml の dispatch を同時に直すこと。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint と build は chromium のダウンロード（約1分）より前に置く。
      # 壊れているPRを安く落とすため。
      - name: Lint
        run: pnpm lint

      # `astro dev`（PlaywrightのwebServer）では adapter/prerender/SSR まわりの
      # 壊れが出ないため、build は別に通す必要がある。
      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
